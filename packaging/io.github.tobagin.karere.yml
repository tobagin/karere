app-id: io.github.tobagin.karere
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: karere
appstream-compose: true

add-extensions:
  io.github.tobagin.karere.Debug:
    directory: lib/debug
    autodelete: true
    no-autodownload: true

cleanup:
  - '*.la'
  - '*.a'
  - /include
  # CEF SDK files used only while building the karere module (cef-dll-sys cmake);
  # nothing reads them at runtime. chrome-sandbox is intentionally kept.
  - /lib/cef/include
  - /lib/cef/libcef_dll
  - /lib/cef/cmake
  - /lib/cef/CMakeLists.txt

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/karere/cargo
    CARGO_NET_OFFLINE: 'true'
    CEF_PATH: /app/lib/cef
    CARGO_BUILD_JOBS: '6'

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # --device=all, not --device=dri: Chromium reaches webcams through V4L2
  # (/dev/video*). The PipeWire camera portal path (WebRtcPipeWireCamera) is
  # not enabled or tested, so dri alone would lose the camera in calls.
  - --device=all
  - --filesystem=xdg-download
  # Notifications use gio::Notification, i.e. the notification portal;
  # no org.freedesktop.Notifications access is needed.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=LD_LIBRARY_PATH=/app/lib/cef
  - --env=GSK_RENDERER=gl

modules:
  - name: cef-binaries
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/cef
      - cp -a include libcef_dll cmake CMakeLists.txt /app/lib/cef/
      - cp -a Release/. /app/lib/cef/
      - cp -a Resources/. /app/lib/cef/
      - chmod +x /app/lib/cef/chrome-sandbox || true
      - install -Dm644 archive.json /app/lib/cef/archive.json
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/tobagin/karere/releases/download/cef-156.0.26-proprietary-codecs-2/cef_binary_156.0.26%2Bg8ea0c73%2Bchromium-156.0.8078.88_linux64_minimal.zip
        sha256: 027473508ec25227972a8bc9182b15723f98cfa2e301746f8e2224c6a58517d5
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/tobagin/karere/releases/download/cef-156.0.26-proprietary-codecs-2/cef_binary_156.0.26%2Bg8ea0c73%2Bchromium-156.0.8078.88_linuxarm64_minimal.zip
        sha256: 9dd971ca62b3282b8b6b55da6490b5676550e6b6a25039c599cce9e69f4ccb76
      - type: inline
        only-arches: [x86_64]
        contents: |
          {"type":"minimal","name":"cef_binary_156.0.26+g8ea0c73+chromium-156.0.8078.88_linux64_minimal.tar.bz2","sha1":"0000000000000000000000000000000000000000"}
        dest-filename: archive.json
      - type: inline
        only-arches: [aarch64]
        contents: |
          {"type":"minimal","name":"cef_binary_156.0.26+g8ea0c73+chromium-156.0.8078.88_linuxarm64_minimal.tar.bz2","sha1":"0000000000000000000000000000000000000000"}
        dest-filename: archive.json

  # Chromium sandbox under Flatpak: zypak stands in for the setuid
  # chrome-sandbox and starts the zygote and renderers in nested Flatpak
  # sandboxes through the Flatpak portal.
  - name: zypak
    sources:
      # zypak v2025.09 (commit 693a71c5). Archives, not a git source: the
      # release workflow and manifest tests treat the first tag/commit lines
      # as the karere pin.
      - type: archive
        url: https://github.com/refi64/zypak/archive/693a71c5ffa80ec9c9ce2ae03b1ccc493c698e53.tar.gz
        sha256: e83ac703821367e33fcacd7661ea82d9d2a475d40fd7de411e1a97bfb27c1ed1
      # Its nickle submodule (header only) at the commit v2025.09 pins.
      - type: archive
        url: https://github.com/refi64/nickle/archive/0ac7f5dbf659caa8d1d45cb57e942f2bc565da1e.tar.gz
        sha256: edd5a4e49e3b703c99732cd1c821c0cf4de79391db6eac59c24103e3bb2627cf
        dest: nickle

  - name: karere
    buildsystem: meson
    config-opts:
      - -Dprofile=default
    sources:
      - type: git
        url: https://github.com/tobagin/karere
        tag: v4.4.1
        commit: 44b462d33985bb0129dc0251dab600149cfee848
      - cargo-sources.json
    post-install:
      - mkdir -p ${FLATPAK_DEST}/share/karere
      - mv ${FLATPAK_DEST}/share/locale ${FLATPAK_DEST}/share/karere/locale

  # /app/bin/karere is the zypak launcher; the real binary lives in libexec.
  # Desktop, autostart and D-Bus launches all run `karere`, so they all get it.
  - name: karere-launcher
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/libexec
      - mv ${FLATPAK_DEST}/bin/karere ${FLATPAK_DEST}/libexec/karere
      - install -Dm755 karere-launcher ${FLATPAK_DEST}/bin/karere
    sources:
      - type: script
        dest-filename: karere-launcher
        commands:
          - export ZYPAK_CEF_LIBRARY_PATH=/app/lib/cef/libcef.so
          - exec zypak-wrapper /app/libexec/karere "$@"

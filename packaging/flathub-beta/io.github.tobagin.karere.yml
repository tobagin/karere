app-id: io.github.tobagin.karere
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: karere
appstream-compose: true

# Detached debug symbols extension; flatpak-builder fills /app/lib/debug from the
# unstripped binary (see Cargo.toml) to keep the base bundle small.
add-extensions:
  io.github.tobagin.karere.Debug:
    directory: lib/debug
    autodelete: true
    no-autodownload: true

# Drop dev-only artifacts Flathub flags. /lib/cef/include is NOT under /include,
# so CEF's headers (used by the embedded loader) survive the /include cleanup.
cleanup:
  - '*.la'
  - '*.a'
  - /include

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/karere/cargo
    CARGO_NET_OFFLINE: 'true'
    CEF_PATH: /app/lib/cef
    # Cap parallel rustc jobs so the heavy crate graph doesn't OOM-kill (137).
    CARGO_BUILD_JOBS: '6'

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  # xdg-download (not home) passes the linter without a home-filesystem exception;
  # downloads land in ~/Downloads. Matches the stable manifest.
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # Autostart goes through the XDG Background portal (ashpd) — no autostart
  # filesystem or portal.Desktop talk-name needed (portal busnames auto-granted).
  - --env=LD_LIBRARY_PATH=/app/lib/cef
  - --env=GSK_RENDERER=gl

modules:
  - name: cef-binaries
    buildsystem: simple
    build-commands:
      # Merge the CEF tarball into one flat layout (cmake prereqs + Release/ +
      # Resources/): cef-dll-sys build.rs cmakes this dir and copies root files
      # next to the binary, so build and runtime both need it merged.
      - mkdir -p /app/lib/cef
      - cp -a include libcef_dll cmake CMakeLists.txt /app/lib/cef/
      - cp -a Release/. /app/lib/cef/
      - cp -a Resources/. /app/lib/cef/
      - chmod +x /app/lib/cef/chrome-sandbox || true
      - install -Dm644 archive.json /app/lib/cef/archive.json
    sources:
      # Proprietary-codec CEF (H.264/AAC) from tools/build-cef-codecs.sh,
      # matching the `cef` crate pinned by the built tag (150 for v4.2.x).
      # archive.json cites the exact shipped tag so the crate's version check passes.
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/tobagin/karere/releases/download/cef-152.0.6-proprietary-codecs/cef_binary_152.0.6%2Bg708dc14%2Bchromium-152.0.7977.83_linux64_minimal.zip
        sha256: 3d64f6fac8911a368ffa415e3ee53d002cbd792866f08ed6578dae1e252cbac8
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/tobagin/karere/releases/download/cef-152.0.6-proprietary-codecs/cef_binary_152.0.6%2Bg708dc14%2Bchromium-152.0.7977.83_linuxarm64_minimal.zip
        sha256: fcf2ca3fd37dbd89f8a1dc58cec2f374164eb9a7e76baa96409013368dcaa42a
      - type: inline
        only-arches: [x86_64]
        contents: |
          {"type":"minimal","name":"cef_binary_152.0.6+g708dc14+chromium-152.0.7977.83_linux64_minimal.tar.bz2","sha1":"0000000000000000000000000000000000000000"}
        dest-filename: archive.json
      - type: inline
        only-arches: [aarch64]
        contents: |
          {"type":"minimal","name":"cef_binary_152.0.6+g708dc14+chromium-152.0.7977.83_linuxarm64_minimal.tar.bz2","sha1":"0000000000000000000000000000000000000000"}
        dest-filename: archive.json

  - name: karere
    buildsystem: meson
    config-opts:
      - -Dprofile=default
    sources:
      # Flathub pulls the tagged GitHub source. Update tag + commit per release.
      # Between beta cycles beta mirrors stable; `commit` is synced to the tag
      # commit when the Flathub beta branch is pushed.
      - type: git
        url: https://github.com/tobagin/karere
        tag: v4.3.0
        commit: c8b3d71833d6b858f58b73f715aefec63ed98d14
      - cargo-sources.json
    # Move our gettext catalogs out of share/locale so flatpak's automatic
    # per-language .Locale extension (which only deploys the host's languages)
    # doesn't strip the locales the in-app language picker offers.
    post-install:
      - mkdir -p ${FLATPAK_DEST}/share/karere
      - mv ${FLATPAK_DEST}/share/locale ${FLATPAK_DEST}/share/karere/locale

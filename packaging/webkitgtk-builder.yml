app-id: io.github.tobagin.karere.WebKitBuilder
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: webkitgtk-builder

build-options:
  env:
    CFLAGS: '-g0'
    CXXFLAGS: '-g0 -DNDEBUG'

modules:
  # unifdef is required by the WebKitGTK build system
  - name: unifdef
    buildsystem: simple
    build-commands:
      - make install prefix=/app CFLAGS="-std=c11 -D_XOPEN_SOURCE=700"
    sources:
      - type: archive
        url: https://dotat.at/prog/unifdef/unifdef-2.12.tar.xz
        sha256: 43ce0f02ecdcdc723b2475575563ddb192e988c886d368260bc0a63aee3ac400

  # libevent — required by LibWebRTC's threading/event loop. The GNOME
  # Platform 50 SDK doesn't ship it; build it inside the Flatpak so the
  # WebKitGTK module can find it during cmake configure.
  - name: libevent
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-debug-mode
      - --disable-libevent-regress
      - --disable-samples
    sources:
      - type: archive
        url: https://github.com/libevent/libevent/releases/download/release-2.1.12-stable/libevent-2.1.12-stable.tar.gz
        sha256: 92e6de1be9ec176428fd2367677e61ceffc2ee1cb119035037a27d346b0403bb

  # WebKitGTK built inside the GNOME Platform 50 SDK so all dependencies
  # (libxml2, ICU, libsoup, etc.) match the runtime exactly.
  #
  # Source is fetched from the full WebKit git repository (NOT the
  # webkitgtk.org release tarball) because the release tarballs strip
  # out Source/ThirdParty/libwebrtc, which is required to build the
  # LibWebRTC backend. The git checkout is ~5GB and the configure
  # step alone enumerates ~200k files — total build is ~3-4h per arch
  # in CI, paid once per WebKitGTK release.
  #
  # USE_GSTREAMER_WEBRTC=OFF is the key flip. The cmake logic in
  # Source/cmake/GStreamerChecks.cmake auto-derives USE_LIBWEBRTC from
  # USE_GSTREAMER_WEBRTC (USE_LIBWEBRTC=ON has no effect on its own —
  # it gets silently overridden to FALSE whenever USE_GSTREAMER_WEBRTC
  # is ON, which is the cmake default). Setting USE_GSTREAMER_WEBRTC=OFF
  # both selects the LibWebRTC backend AND skips the librice/libnice
  # checks that would otherwise FATAL_ERROR a libwebrtc-only build.
  - name: webkitgtk
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DPORT=GTK
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      # Force plain lib/ and libexec/ paths — the GNOME SDK is Ubuntu-based
      # and defaults to multiarch paths (lib/x86_64-linux-gnu/ etc.) which
      # breaks our tarball packaging and the Devel manifest install commands.
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_INSTALL_LIBEXECDIR=libexec
      - -DENABLE_WEB_RTC=ON
      - -DENABLE_MEDIA_STREAM=ON
      - -DENABLE_WEBDRIVER=OFF
      - -DENABLE_MINIBROWSER=OFF
      - -DENABLE_DOCUMENTATION=OFF
      - -DENABLE_INTROSPECTION=OFF
      - -DENABLE_GAMEPAD=OFF
      - -DENABLE_SPEECH_SYNTHESIS=OFF
      - -DUSE_SOUP2=OFF
      - -DUSE_GTK4=ON
      - -DUSE_LIBBACKTRACE=OFF
      - -DENABLE_BUBBLEWRAP_SANDBOX=OFF
      # Flip OFF the GStreamer webrtcbin backend so the cmake logic
      # auto-selects USE_LIBWEBRTC=TRUE. This is the ONLY way to actually
      # build with LibWebRTC — see comment above.
      - -DUSE_GSTREAMER_WEBRTC=OFF
    sources:
      - type: git
        url: https://github.com/WebKit/WebKit.git
        tag: webkitgtk-2.53.3
        commit: 9cd50fb44653d91ceb8d7a6b70d693b2ad1aa0a7

  # Dummy command required by flatpak-builder to finish the app
  - name: dummy
    buildsystem: simple
    build-commands:
      - install -Dm755 /dev/null /app/bin/webkitgtk-builder

app-id: io.github.tobagin.karere.WebKitBuilder
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: webkitgtk-builder

build-options:
  env:
    CFLAGS: '-g0'
    CXXFLAGS: '-g0 -DNDEBUG'

modules:
  # unifdef is required by the WebKitGTK build system
  - name: unifdef
    buildsystem: simple
    build-commands:
      - make install prefix=/app CFLAGS="-std=c11 -D_XOPEN_SOURCE=700"
    sources:
      - type: archive
        url: https://dotat.at/prog/unifdef/unifdef-2.12.tar.xz
        sha256: 43ce0f02ecdcdc723b2475575563ddb192e988c886d368260bc0a63aee3ac400

  # WebKitGTK built inside the GNOME Platform 50 SDK so all dependencies
  # (libxml2, ICU, libsoup, etc.) match the runtime exactly.
  #
  # Pinned to latest WebKitGTK upstream (2.53.x is the development branch
  # — odd minor numbers are dev snapshots, but we follow them so call
  # support improves as Apple/Igalia patch the LibWebRTC integration).
  # LibWebRTC backend is enabled — without
  # it WhatsApp Web's call-button component throws inside React (Invariant
  # Violation #11797 in the gkx module) at render time because the
  # GStreamer webrtcbin backend reports a subset of WebRTC behaviour that
  # WA's calling code rejects. The 2.50.5-gnome50 release tarball was
  # built with this same config and is what currently ships in the
  # production Devel manifest. This file updates that recipe to the
  # latest stable tag so a fresh CI run rebuilds a 2.52.3 LibWebRTC tarball.
  - name: webkitgtk
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DPORT=GTK
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      # Force plain lib/ and libexec/ paths — the GNOME SDK is Ubuntu-based
      # and defaults to multiarch paths (lib/x86_64-linux-gnu/ etc.) which
      # breaks our tarball packaging and the Devel manifest install commands.
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_INSTALL_LIBEXECDIR=libexec
      - -DENABLE_WEB_RTC=ON
      - -DENABLE_MEDIA_STREAM=ON
      - -DENABLE_WEBDRIVER=OFF
      - -DENABLE_MINIBROWSER=OFF
      - -DENABLE_DOCUMENTATION=OFF
      - -DENABLE_INTROSPECTION=OFF
      - -DENABLE_GAMEPAD=OFF
      - -DENABLE_SPEECH_SYNTHESIS=OFF
      - -DUSE_SOUP2=OFF
      - -DUSE_GTK4=ON
      - -DUSE_LIBBACKTRACE=OFF
      - -DENABLE_BUBBLEWRAP_SANDBOX=OFF
      # Use Google's LibWebRTC (Chromium WebRTC stack) instead of the
      # GStreamer webrtcbin backend. LibWebRTC is what WhatsApp Web's call
      # code is implemented against — switching backends regresses the
      # call button to a "Something went wrong" disabled fallback because
      # WA's render-time capability probes reject the GST shape. Build
      # time is ~2 hours instead of ~20 minutes; that's paid once per
      # WebKitGTK release in CI.
      - -DUSE_LIBWEBRTC=ON
    sources:
      - type: archive
        url: https://webkitgtk.org/releases/webkitgtk-2.53.3.tar.xz
        sha256: 369863f6c32672d1b10b4e749e7e22f6f081aacab02b92b0bdf5c0706eebf7f8

  # Dummy command required by flatpak-builder to finish the app
  - name: dummy
    buildsystem: simple
    build-commands:
      - install -Dm755 /dev/null /app/bin/webkitgtk-builder

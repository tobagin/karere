<!doctype html>
<meta charset="utf-8">
<title>Generated GPU-heavy CEF frame integrity fixture</title>
<style>html,body{margin:0;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
<canvas></canvas>
<script>
'use strict';
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2', {alpha: false, antialias: false});
if (!gl) throw new Error('WebGL2 unavailable in generated fixture');
function shader(type, source) {
  const object = gl.createShader(type);
  gl.shaderSource(object, source);
  gl.compileShader(object);
  if (!gl.getShaderParameter(object, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(object));
  }
  return object;
}
const program = gl.createProgram();
gl.attachShader(program, shader(gl.VERTEX_SHADER, `#version 300 es
  const vec2 vertices[3] = vec2[3](vec2(-1.,-1.), vec2(3.,-1.), vec2(-1.,3.));
  void main() {gl_Position = vec4(vertices[gl_VertexID],0.,1.);}`));
gl.attachShader(program, shader(gl.FRAGMENT_SHADER, `#version 300 es
  precision highp float;
  uniform vec3 fixtureColor;
  out vec4 color;
  void main() {
    float work = gl_FragCoord.x * .01 + gl_FragCoord.y * .007;
    for (int i = 0; i < 96; ++i) work = sin(work * 1.999 + float(i));
    color = vec4(fixtureColor + vec3(work * .0001), 1.);
  }`));
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
  throw new Error(gl.getProgramInfoLog(program));
}
gl.useProgram(program);
const color = gl.getUniformLocation(program, 'fixtureColor');
let frame = 0;
function paint() {
  if (canvas.width !== innerWidth || canvas.height !== innerHeight) {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  frame = (frame + 1) % 128;
  gl.uniform3f(color, (64 + frame) / 255,
    (64 + frame * 37 % 128) / 255, (64 + frame * 53 % 128) / 255);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(paint);
}
requestAnimationFrame(paint);
</script>

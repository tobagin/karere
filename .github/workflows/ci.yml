name: CI

# Build gate + headless boot smoke test. The Rust app links libcef, so a native
# `cargo test`/clippy can't link without the CEF binaries — the real gate builds
# the Flatpak (the canonical, offline-vendored build) and boots it headless. This
# is what catches the startup-crash class that unit tests can't see.

on:
  push:
    branches: ['**']   # branches only; tag pushes are handled by update-flatpak.yml
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke:
    name: Build + headless smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb

      - name: Add Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      # Caches the heavy bits across runs: the CEF tarball download and ccache
      # objects under .flatpak-builder. Keyed on the manifest + vendored crates +
      # lockfile so a dependency or manifest change busts it.
      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: fb-${{ runner.os }}-${{ hashFiles('packaging/io.github.tobagin.karere.Devel.yml', 'packaging/cargo-sources.json', 'Cargo.lock') }}
          restore-keys: |
            fb-${{ runner.os }}-

      - name: Build + install (Devel manifest)
        # Devel and production share all Rust/CEF code; building Devel gates the
        # same startup path. --install-deps-from pulls the GNOME runtime + SDK +
        # rust-stable extension declared in the manifest.
        run: |
          flatpak-builder --user --install --install-deps-from=flathub \
            --force-clean --ccache build-dir-ci \
            packaging/io.github.tobagin.karere.Devel.yml

      - name: Headless smoke test
        run: bash .github/scripts/smoke-test.sh io.github.tobagin.karere.Devel

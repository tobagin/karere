name: Build CEF (proprietary codecs)

# Rebuild Chromium+CEF with proprietary codecs (H.264/AAC) for WhatsApp MP4; uploads
# tarball+sha256 to point the manifest at. ~100 GB build: needs a >=120 GB runner.

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Explicit legacy rebuild, or upgrade after a fixed stable CEF release is verified"
        required: true
        type: choice
        options: [upgrade, legacy-current-pin]
        default: upgrade
      cef_version:
        description: "Full CEF release version (must match checkout and Rust bindings)"
        required: true
        type: string
        default: "152.0.6+g708dc14+chromium-152.0.7977.83"
      arch:
        description: "Target architecture; ARM64 can be cross-compiled on x64"
        required: true
        type: choice
        options: [x64, arm64]
        default: x64
      cef_branch:
        description: "CEF branch number for Chromium 152 (see https://bitbucket.org/chromiumembedded/cef/wiki/BranchesAndBuilding)"
        required: true
        type: string
        default: "7977"
      cef_checkout:
        description: "Exact CEF commit; patches must be verified against this revision"
        required: true
        default: "708dc140cbc3286826a8abef89dc23a44ff9ea72"
        type: string
      runner:
        description: "Runner label(s). Default = GitHub free runner (likely too small). Override with a larger/self-hosted runner."
        required: false
        default: "ubuntu-22.04"
        type: string

jobs:
  build:
    name: Build CEF (${{ inputs.arch }}, proprietary codecs)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 4320   # only honored by self-hosted; free runners hard-cap at 6 h
    steps:
      - name: Checkout (for the build script)
        uses: actions/checkout@v4

      - name: Verify released engine before provisioning/building
        env:
          CEF_BUILD_MODE: ${{ inputs.build_mode }}
          CEF_VERSION: ${{ inputs.cef_version }}
          CEF_CHECKOUT: ${{ inputs.cef_checkout }}
          CEF_BRANCH: ${{ inputs.cef_branch }}
          CEF_ARCH: ${{ inputs.arch }}
        run: |
          python3 tools/cef-release.py preflight --mode "$CEF_BUILD_MODE" \
            --cef-version "$CEF_VERSION" --cef-checkout "$CEF_CHECKOUT" \
            --cef-branch "$CEF_BRANCH" --arch "$CEF_ARCH"

      - name: Maximize build disk
        if: ${{ inputs.runner == 'ubuntu-22.04' }}
        # Reclaim preinstalled toolchains into one LVM at the build dir.
        uses: easimon/maximize-build-space@master
        with:
          # 6 GB root floor for logs+apt+checkout (4 GB OOMs); rest to LVM.
          root-reserve-mb: 6144
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          build-mount-path: /cef-build

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git python3 python3-pip curl ca-certificates lsb-release sudo \
            build-essential pkg-config

      - name: Build CEF with proprietary codecs
        env:
          CEF_BUILD_MODE: ${{ inputs.build_mode }}
          CEF_VERSION: ${{ inputs.cef_version }}
          CEF_BRANCH: ${{ inputs.cef_branch }}
          CEF_CHECKOUT: ${{ inputs.cef_checkout }}
          CEF_ARCH: ${{ inputs.arch }}
          CEF_NINJA_JOBS: "3"
          CEF_NINJA_RETRIES: "2"
          AUTOMATE_EXTRA: "--no-chromium-history"
        run: |
          set -eux
          sudo mkdir -p /cef-build
          sudo chown -R "$USER" /cef-build
          # Keep codecs and all Karere CEF/Chromium patches in one pipeline.
          bash tools/build-cef-codecs.sh /cef-build
          df -h /cef-build || true

      - name: Locate verified artifact
        id: dist
        env:
          CEF_ARCH: ${{ inputs.arch }}
        run: |
          set -eux
          TARBALL=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["artifact"])' "/cef-build/cef-artifact-$CEF_ARCH.json")
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$TARBALL")" >> "$GITHUB_OUTPUT"
          (cd "$(dirname "$TARBALL")" && sha256sum --check "$(basename "$TARBALL").sha256")

      - name: Upload CEF distribution
        uses: actions/upload-artifact@v4
        with:
          # Legacy cef-152-proprietary-codecs artifacts now include the exact
          # full version and target architecture instead of a stale fixed label.
          name: proprietary-codecs-${{ steps.dist.outputs.name }}
          path: |
            ${{ steps.dist.outputs.tarball }}
            ${{ steps.dist.outputs.tarball }}.sha256
            ${{ steps.dist.outputs.tarball }}.provenance.json
          retention-days: 14
          if-no-files-found: error

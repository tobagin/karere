[package]
name = "karere"
version = "4.3.5"
edition = "2024"
rust-version = "1.88"
description = "GTK4 + libadwaita + CEF native WhatsApp client (Karere v4)"
license = "GPL-3.0-or-later"
publish = false
exclude = [
    "packaging/build-dir/**",
    "packaging/.flatpak-builder/**",
    "build/**",
    "builddir/**",
    "build-dir/**",
    "repo/**",
    ".flatpak-builder/**",
    "cef-binaries/**",
]

[[bin]]
name = "karere"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
# X11 window origin for RenderHandler::screen_point (KARE-019):
# - Standalone gdk4-x11 0.11 crate aligned to gtk4 0.11 (not gdk4 "x11" feature).
# - "xlib" feature required: GTK4 0.11 has no root GdkSurface to
#   translate against and gdk4-x11-sys 0.11 binds only get_xid/get_group;
#   the viable physical-origin path is XTranslateCoordinates via XDisplay.
#   That API returns X-server physical pixels already (GDK_SCALE physical
#   sizing under X11), so the result is passed through clamped without
#   re-scaling. Translating would need logical→physical scaling which is
#   not used here.
gdk4-x11 = { version = "0.11", features = ["xlib"] }
x11 = { package = "x11-dl", version = "2.21" }
libadwaita = { version = "0.9", features = ["v1_6"] }
glib = "0.22"
gio = "0.22"
gdk-pixbuf = "0.22"
cef = "152.3"
gl = "0.14"
libloading = "0.9"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
ashpd = { version = "0.13", default-features = false, features = ["gtk4", "background", "open_uri", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
ksni = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
# Panic strategy: keep the default (unwind). A panic on a tokio worker (tray/portal
# work) must not take the whole app down; panics inside extern "C" callbacks
# already abort at the FFI boundary.
lto = "thin"
codegen-units = 1
# Keep debug info unstripped here: flatpak-builder strips the installed binary and
# splits symbols into the io.github.tobagin.karere.Debug extension (/app/lib/debug),
# so `coredumpctl debug karere` resolves frame names. debug=1 = line tables +
# function symbols (no var/type info) to cap memory on the heavy CEF graph.
debug = 1
strip = false
